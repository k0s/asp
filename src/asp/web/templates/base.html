<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}asp{% endblock %}</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f3f0; --surface: #fcfcfb; --line: #e4e2dc; --hover: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7c7a74;
  --created: #2a78d6; --modified: #eb6834; --deleted: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --neutral: #9c9a93; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110; --surface: #1a1a19; --line: #30302d; --hover: #242422;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8d85;
    --created: #3987e5; --modified: #d95926; --deleted: #199e70;
    --accent: #6da7ec;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1120px; margin: 0 auto; padding: 0 20px; display: flex;
  align-items: center; gap: 4px; height: 52px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.02em; margin-right: 16px;
  color: var(--text); }
nav { display: flex; gap: 2px; flex: 1; }
nav a { color: var(--text-2); padding: 6px 10px; border-radius: 6px; }
nav a:hover { background: var(--hover); text-decoration: none; }
nav a[aria-current] { color: var(--text); background: var(--hover); font-weight: 600; }
.count { background: var(--critical); color: #fff; border-radius: 9px; padding: 0 6px;
  font-size: 11px; font-weight: 700; margin-left: 4px; }
main { max-width: 1120px; margin: 0 auto; padding: 20px; }
h1 { font-size: 20px; margin: 0 0 14px; letter-spacing: -.01em; }
h2 { font-size: 13px; margin: 0; font-weight: 600; color: var(--text-2);
  text-transform: uppercase; letter-spacing: .05em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  margin-bottom: 16px; overflow: hidden; }
.card > .head { display: flex; justify-content: space-between; align-items: baseline;
  padding: 12px 16px 0; gap: 12px; }
.card > .body { padding: 12px 16px 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; }
.tile .value { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15;
  margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .note { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3);
  padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--hover); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.when, td.dim { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.path { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
  overflow-wrap: anywhere; }
td > a.path { display: inline-block; min-width: 200px; }
.path .root { color: var(--text-3); }
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neutral); flex: none; }
.dot.created { background: var(--created); } .dot.modified { background: var(--modified); }
.dot.deleted { background: var(--deleted); }
.dot.done { background: var(--good); } .dot.failed { background: var(--serious); }
.dot.parked { background: var(--critical); } .dot.queued { background: var(--warning); }
.pill { font-size: 11.5px; border: 1px solid var(--line); border-radius: 9px;
  padding: 0 7px; color: var(--text-2); white-space: nowrap; }
.error { color: var(--text-2); font-size: 12.5px; }
.empty { padding: 28px 16px; text-align: center; color: var(--text-3); }
form.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
select, input[type=search], button { font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 10px; }
input[type=search] { min-width: 240px; }
button { cursor: pointer; font-weight: 600; }
button:hover { background: var(--hover); }
button.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
button.primary:hover { opacity: .85; }
button.small { padding: 2px 9px; font-size: 12.5px; }
.live { color: var(--text-3); font-size: 12.5px; display: flex; align-items: center;
  gap: 6px; margin-right: 10px; }
.banner { background: var(--surface); border: 1px solid var(--critical); border-radius: 10px;
  padding: 10px 16px; margin-bottom: 16px; }
.more { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.legend { display: flex; gap: 14px; color: var(--text-2); font-size: 12.5px; }
.thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 5px;
  border: 1px solid var(--line); display: block; background: var(--hover); }
.preview { max-width: 100%; max-height: 420px; border-radius: 8px;
  border: 1px solid var(--line); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px; }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 7px;
  border: 1px solid var(--line); display: block; background: var(--hover); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dt { color: var(--text-3); } dd { margin: 0; }
svg text { fill: var(--text-3); font-size: 11px; }
.grid { stroke: var(--line); stroke-width: 1; }
.seg.created { fill: var(--created); } .seg.modified { fill: var(--modified); }
.seg.deleted { fill: var(--deleted); }
.hit { fill: transparent; } .hit:hover { fill: var(--text); fill-opacity: .06; }
#tip { position: fixed; pointer-events: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 4px 14px rgb(0 0 0 / .14); display: none; z-index: 10; min-width: 130px; }
#tip b { display: block; margin-bottom: 4px; }
#tip div { display: flex; justify-content: space-between; gap: 14px; }
details summary { cursor: pointer; color: var(--text-3); font-size: 12.5px; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">asp</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" {% if here == "/" %}aria-current="page"{% endif %}>Overview</a>
    <a href="/events" {% if here == "/events" %}aria-current="page"{% endif %}>Events</a>
    <a href="/jobs" {% if here == "/jobs" %}aria-current="page"{% endif %}>Jobs{% if attention %}<span class="count" title="failed or parked">{{ attention }}</span>{% endif %}</a>
    <a href="/files" {% if here in ("/files", "/file") %}aria-current="page"{% endif %}>Files</a>
    <a href="/rules" {% if here == "/rules" %}aria-current="page"{% endif %}>Rules</a>
  </nav>
  <label class="live"><input type="checkbox" id="live"> live</label>
  <form method="post" action="/run"><button class="primary">Run a pass</button></form>
</div></header>
<main>
{% if state.error %}<div class="banner"><strong>The last pass failed.</strong> <span class="error">{{ state.error }}</span></div>{% endif %}
{% block main %}{% endblock %}
</main>
<div id="tip"></div>
<script>
// "live" reloads the page every few seconds; the choice is remembered.
const live = document.getElementById("live");
live.checked = localStorage.getItem("asp-live") === "1";
live.addEventListener("change", () => localStorage.setItem("asp-live", live.checked ? "1" : "0"));
setInterval(() => { if (live.checked && !document.querySelector("input:focus")) location.reload(); }, 5000);
</script>
{% block script %}{% endblock %}
</body>
</html>
