[project]
name = "asp"
version = "0.0.0"
description = "A filesystem data pipeline: watch directories, journal every change, run rules that react."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
monitor = [
    "watchdog>=6",
]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
asp = "asp.cli:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx2",
    "asp[web,monitor]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
xfail_strict = true
